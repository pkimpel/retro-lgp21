<meta name="Author" content="Paul Kimpel">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<link id=defaultStyleSheet rel=stylesheet type="text/css" href="Common.css">
<link id=PunchStyleSheet rel=stylesheet type="text/css" href="TallyTapePunch.css">
</head>

<body id=PunchBody>

<div id=PunchDiv class=brushedStainless>
    <div id=ControlsDiv>
        <img id=TPMenuIcon src="./resources/icons8-menu-24.png" alt="Paper-Tape Punch menu icon"
             title="Click to open the paper-tape punch menu">
        <button id=TPTapeFeedBtn type=button title="Feed blank tape">TAPE FEED</button>
        <input id=TPView type=text READONLY>
    </div>

    <div id=TPControlsMenu>
        <button id=TPSavePTXBtn type=button title="Save as .ptx format (text)"
                >Save PTX</button>&nbsp;
        <button id=TPSavePTPBtn type=button title="Save as .ptp format (binary)"
                >Save PTP</button>&nbsp;
        <button id=TPExtractBtn type=button title="Extract tape image as text to a new window"
                >Extract</button>&nbsp;
        <button id=TPClearBtn type=button>Clear</button>&nbsp;
        <button id=TPMenuCloseBtn type=button>Close</button>
    </div>
</div>

</body>
</html>
