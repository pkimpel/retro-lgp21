<html>

<meta name="Author" content="Paul Kimpel">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<link id=defaultStyleSheet rel=stylesheet type="text/css" href="Common.css">
<link id=readerStyleSheet rel=stylesheet type="text/css" href="TallyTapeReader.css">
</head>

<body id=ReaderBody>

<div id=ReaderDiv class=brushedStainless>
    <div id=ControlsDiv>
        <img id=TRMenuIcon src="./resources/icons8-menu-24.png" alt="Paper-Tape Reader menu icon"
             title="Click to open the paper-tape reader menu">
        <button id=TRForwardBtn type=button title="Move tape forward">FORWARD</button>
        <button id=TRRewindBtn type=button"Move tape in reverse">REWIND</button>
        <meter id=TRTapeSupplyBar min=0 max=100 value=0
               title="Tape Buffer Remaining"></meter>
        <input id=TRView type=text READONLY>
    </div>

    <div id=TRControlsMenu>
        <select id=TRFormatSelect
                title="Select image file format &ndash; &quot;Auto&quot; selects by file-name extension">
            <option value=Auto selected>Auto
            <option value=".ptp"       >.ptp (binary)
            <option value=".ptx"       >.ptx (text)
        </select>
        <div id=TRBufferStatus>Buffer <span id=TRBufferLevel>Empty</span></div>
        <button id=TRUnloadBtn>Unload</button>
        <button id=TRMenuCloseBtn>Close</button>
        <input id=TRFileSelector type=file size=40 accept=".ptp,.ptx" multiple
               title="Must select image format before selecting files">
    </div>
</div>

</body>
</html>
